<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>മുട്ട (MOTTA) | Farm Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Outfit', sans-serif; } 
    .font-malayalam { font-family: 'Noto Sans Malayalam', sans-serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            leaf: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#16a34a', 700: '#15803d' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <!-- ================= PIN AUTH ================= -->
  <div id="login-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-xs w-full p-8 text-center shadow-2xl">
      <div class="flex items-center justify-center gap-1.5 mb-2">
        <span class="font-malayalam text-4xl font-black text-leaf-700">മുട്ട</span>
      </div>
      <h2 class="text-xl font-bold text-gray-900 mb-1">Admin Portal</h2>
      <p class="text-xs text-gray-500 mb-6">Enter 4-digit PIN to access orders</p>
      
      <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full text-center tracking-widest text-3xl p-3 border-2 border-gray-100 rounded-xl mb-6 focus:outline-none focus:border-leaf-600 bg-gray-50">
      
      <button onclick="checkPin()" class="w-full bg-leaf-700 hover:bg-leaf-600 text-white font-bold py-3.5 rounded-xl transition shadow-md">
        Unlock Dashboard
      </button>
    </div>
  </div>

  <!-- ================= MAIN ADMIN DASHBOARD ================= -->
  <div id="admin-dashboard" class="hidden flex-col min-h-screen">
    
    <!-- Top Bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-leaf-50 rounded-lg flex items-center justify-center">
            <span class="font-malayalam text-2xl font-black text-leaf-700">മുട്ട</span>
          </div>
          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">Drop Manager</h1>
            <span class="text-[11px] text-gray-500 font-semibold uppercase tracking-wider">TVM Deliveries (695xxx)</span>
          </div>
        </div>
        
        <div class="flex items-center gap-3">
          <button onclick="loadOrders()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold px-4 py-2 rounded-lg transition">
            🔄 Refresh
          </button>
          <button onclick="logout()" class="text-xs text-red-600 font-bold px-2 py-2">
            Lock
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
      
      <!-- Metrics Bar -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <span class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Active Subs</span>
          <div class="text-3xl font-black text-gray-900 mt-1" id="stat-active">0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <span class="text-[11px] text-amber-600 font-bold uppercase tracking-wider">Renewals Due</span>
          <div class="text-3xl font-black text-amber-600 mt-1" id="stat-renewals">0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <span class="text-[11px] text-blue-600 font-bold uppercase tracking-wider">Total TVM Orders</span>
          <div class="text-3xl font-black text-blue-600 mt-1" id="stat-total">0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <span class="text-[11px] text-leaf-600 font-bold uppercase tracking-wider">Completed</span>
          <div class="text-3xl font-black text-leaf-600 mt-1" id="stat-completed">0</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div class="flex gap-1 bg-gray-200/70 p-1.5 rounded-xl text-xs font-bold overflow-x-auto">
          <button onclick="filterStatus('All')" id="tab-All" class="filter-tab active bg-white text-gray-900 px-4 py-2 rounded-lg shadow-sm whitespace-nowrap">All Orders</button>
          <button onclick="filterStatus('Active')" id="tab-Active" class="filter-tab text-gray-500 px-4 py-2 rounded-lg whitespace-nowrap">Active Subs</button>
          <button onclick="filterStatus('Renewal Due')" id="tab-Renewal Due" class="filter-tab text-gray-500 px-4 py-2 rounded-lg whitespace-nowrap">⚠️ Renewals</button>
          <button onclick="filterStatus('Completed')" id="tab-Completed" class="filter-tab text-gray-500 px-4 py-2 rounded-lg whitespace-nowrap">Finished</button>
        </div>
        <span id="order-count-badge" class="text-xs text-gray-400 font-bold bg-white px-3 py-1.5 rounded-full border border-gray-200">Loading...</span>
      </div>

      <!-- Orders List -->
      <div id="orders-list" class="space-y-4">
        <div class="text-center py-20 text-gray-400 font-medium text-sm">Fetching live orders from Google Sheets...</div>
      </div>

    </main>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // =========================================================================
    // ⚙️ ADMIN CONFIGURATION:
    // =========================================================================
    const ADMIN_PIN = "1234"; // Set your 4-digit dashboard passcode
    
    // Paste your Google Apps Script Web App URL below
    const SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE"; 
    
    // Your UPI ID for sending payment renewal links
    const UPI_PAYMENT_ID = "yourname@okhdfcbank"; 
    // =========================================================================

    let allOrders = [];
    let currentFilter = "All";

    function checkPin() {
      const pin = document.getElementById('pin-input').value;
      if (pin === ADMIN_PIN) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        document.getElementById('admin-dashboard').classList.add('flex');
        loadOrders();
      } else {
        alert("Incorrect PIN. Please try again.");
      }
    }

    function logout() {
      document.getElementById('pin-input').value = "";
      document.getElementById('admin-dashboard').classList.add('hidden');
      document.getElementById('admin-dashboard').classList.remove('flex');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    async function loadOrders() {
      const listContainer = document.getElementById('orders-list');
      listContainer.innerHTML = '<div class="text-center py-20 text-gray-400 font-medium text-sm">Loading TVM orders...</div>';

      try {
        const res = await fetch(SCRIPT_URL);
        allOrders = await res.json();
        updateMetrics();
        renderOrders();
      } catch (err) {
        listContainer.innerHTML = '<div class="text-center py-20 text-red-500 font-bold text-sm bg-red-50 rounded-2xl">Failed to connect to Google Sheets. Verify your script URL.</div>';
      }
    }

    function updateMetrics() {
      document.getElementById('stat-total').textContent = allOrders.length;
      document.getElementById('stat-active').textContent = allOrders.filter(o => o.status === 'Active').length;
      document.getElementById('stat-renewals').textContent = allOrders.filter(o => o.status === 'Renewal Due').length;
      document.getElementById('stat-completed').textContent = allOrders.filter(o => o.status === 'Completed').length;
    }

    function filterStatus(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.remove('bg-white', 'text-gray-900', 'shadow-sm');
        t.classList.add('text-gray-500');
      });
      const activeTab = document.getElementById(`tab-${status}`);
      if (activeTab) {
        activeTab.classList.add('bg-white', 'text-gray-900', 'shadow-sm');
        activeTab.classList.remove('text-gray-500');
      }
      renderOrders();
    }

    function renderOrders() {
      const listContainer = document.getElementById('orders-list');
      const filtered = currentFilter === "All" ? allOrders : allOrders.filter(o => o.status === currentFilter);

      document.getElementById('order-count-badge').textContent = `${filtered.length} Orders Found`;

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="text-center py-20 text-gray-400 font-medium text-sm border-2 border-dashed border-gray-200 rounded-2xl">No orders found in this category.</div>';
        return;
      }

      listContainer.innerHTML = filtered.map(order => {
        const isSubscription = order.totalDrops > 1;
        const progressPct = Math.min(100, Math.round((order.completedDrops / order.totalDrops) * 100));
        const isRenewalDue = order.status === "Renewal Due";

        let badge = `<span class="text-[10px] font-black px-3 py-1 rounded-full bg-leaf-100 text-leaf-800 uppercase tracking-wider">Active</span>`;
        if (isRenewalDue) badge = `<span class="text-[10px] font-black px-3 py-1 rounded-full bg-amber-100 text-amber-800 uppercase tracking-wider animate-pulse">⚠️ Renewal Due</span>`;
        if (order.status === "Completed") badge = `<span class="text-[10px] font-black px-3 py-1 rounded-full bg-gray-100 text-gray-600 uppercase tracking-wider">Completed</span>`;

        return `
          <div class="bg-white rounded-3xl border ${isRenewalDue ? 'border-amber-300 shadow-md bg-amber-50/10' : 'border-gray-200'} p-5 transition">
            
            <!-- Card Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-gray-100">
              <div>
                <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">${order.date}</span>
                <h3 class="text-xl font-black text-gray-900 leading-tight mt-1">${order.name}</h3>
                <span class="text-[13px] font-bold text-leaf-700">${order.planType}</span>
              </div>
              <div class="flex items-center gap-3">
                ${badge}
                <span class="font-black text-gray-900 text-xl">${order.total}</span>
              </div>
            </div>

            <!-- Subscription Drop Progress Bar -->
            ${isSubscription ? `
              <div class="py-4 border-b border-gray-100 bg-gray-50/50 -mx-5 px-5">
                <div class="flex justify-between items-center text-xs font-bold text-gray-600 mb-2">
                  <span>Deliveries Dispatched:</span>
                  <span class="text-leaf-700 font-black">${order.completedDrops} of ${order.totalDrops} Drops</span>
                </div>
                <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                  <div class="bg-leaf-600 h-full transition-all duration-500 rounded-full" style="width: ${progressPct}%"></div>
                </div>
              </div>
            ` : ''}

            <!-- Delivery Info -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 py-4 text-[13px] text-gray-600">
              <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                <span class="font-bold text-gray-900 block mb-1">📦 Order Details:</span> 
                <span class="font-medium">${order.items}</span>
              </div>
              <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                <span class="font-bold text-gray-900 block mb-1">📍 Address & Slot:</span> 
                <span class="font-medium">${order.address}</span>
                <div class="text-leaf-700 font-bold mt-1.5 flex items-center gap-1">⏰ ${order.slot}</div>
              </div>
            </div>

            <!-- Action Buttons Toolbar -->
            <div class="pt-4 border-t border-gray-100 flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-2">
                <a href="tel:${order.phone}" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5">
                  📞 Call
                </a>

                <!-- Next Drop Dispatch Button -->
                ${order.completedDrops < order.totalDrops ? `
                  <button onclick="dispatchNextDrop('${order.name}', '${order.phone}', '${order.slot}', ${order.completedDrops + 1}, ${order.totalDrops}, ${order.rowIndex})" class="bg-leaf-700 hover:bg-leaf-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-sm">
                    🚚 <span>Dispatch Drop (${order.completedDrops + 1}/${order.totalDrops})</span>
                  </button>
                ` : ''}
              </div>

              <!-- Renewal Reminder Button (Appears on Final Drop) -->
              <div class="flex items-center gap-2">
                ${isRenewalDue ? `
                  <button onclick="sendRenewalReminder('${order.name}', '${order.phone}', '${order.planType}', '${order.total}', ${order.rowIndex})" class="bg-amber-500 hover:bg-amber-400 text-white text-xs font-black px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-md">
                    🔄 <span>Send WhatsApp Renewal</span>
                  </button>
                ` : ''}

                ${order.status === 'Completed' || isRenewalDue ? `
                  <button onclick="markReactivated(${order.rowIndex})" class="text-[11px] text-gray-400 hover:text-leaf-700 font-bold uppercase tracking-wide border border-gray-200 hover:border-leaf-200 px-3 py-2 rounded-lg transition">
                    Reactivate
                  </button>
                ` : ''}
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // DISPATCH LOGIC: Increments counter in sheet and opens WhatsApp
    async function dispatchNextDrop(name, phone, slot, dropNumber, totalDrops, rowIndex) {
      const order = allOrders.find(o => o.rowIndex === rowIndex);
      if (!order) return;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "record_drop",
            rowIndex: rowIndex,
            completedDrops: order.completedDrops,
            totalDrops: totalDrops
          })
        });

        // Open WhatsApp with pre-typed message
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const formattedPhone = cleanPhone.length === 10 ? `91${cleanPhone}` : cleanPhone;
        
        let msg = `🥚 Hi ${name}! Your fresh മുട്ട (MOTTA) delivery is packed and OUT FOR DELIVERY. 🚚\n\n`;
        if (totalDrops > 1) {
          msg += `📦 *Routine Progress:* Drop ${dropNumber} of ${totalDrops}\n`;
        }
        msg += `⏰ *Expected Arrival:* ${slot}\n\nEnjoy your farm-fresh morning!`;

        window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        
        // Reload UI to show progress bar update
        loadOrders();
      } catch (err) {
        alert("Failed to update database. Please check your internet connection.");
      }
    }

    // RENEWAL LOGIC: Opens WhatsApp with pre-filled renewal & UPI payment link
    function sendRenewalReminder(name, phone, planType, total, rowIndex) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const formattedPhone = cleanPhone.length === 10 ? `91${cleanPhone}` : cleanPhone;

      let msg = `🥚 *MOTTA ROUTINE RENEWAL* 🥚\n\n`;
      msg += `Hi ${name}! The final scheduled drop for your *${planType}* has been delivered today.\n\n`;
      msg += `Would you like to renew for next month so your morning egg deliveries continue uninterrupted?\n\n`;
      msg += `💰 *Renewal Total:* ${total}\n`;
      msg += `📲 *Pay instantly via UPI:* \`${UPI_PAYMENT_ID}\`\n\n`;
      msg += `_Reply with "RENEW" after paying to lock in your next delivery slot!_`;

      window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // REACTIVATION LOGIC: Resets drops to 0 for a new month
    async function markReactivated(rowIndex) {
      if (!confirm("Start a new monthly cycle for this customer? (This resets completed drops to 0)")) return;
      
      const order = allOrders.find(o => o.rowIndex === rowIndex);
      if (!order) return;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "record_drop",
            rowIndex: rowIndex,
            completedDrops: -1, // Server increments by 1, so -1 becomes 0 (Reset)
            totalDrops: order.totalDrops
          })
        });
        loadOrders();
      } catch (e) {
        alert("Could not reactivate. Please check your connection.");
      }
    }
  </script>
</body>
</html>
