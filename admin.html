<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motta Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Outfit', sans-serif; } </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

  <!-- PIN LOCK SCREEN -->
  <div id="auth-screen" class="fixed inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center px-4">
    <div class="bg-gray-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl border border-gray-700 text-center">
      <div class="text-emerald-500 text-4xl font-black mb-2">മുട്ട</div>
      <h2 class="text-xl font-bold mb-6 text-white">Enter Admin PIN</h2>
      <input type="password" id="pin-input" class="w-full bg-gray-900 border border-gray-600 rounded-xl p-4 text-center text-2xl tracking-widest text-emerald-400 focus:border-emerald-500 focus:outline-none mb-4" placeholder="••••" maxlength="4">
      <button onclick="checkPin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition">Unlock Dashboard</button>
      <p id="pin-error" class="text-red-400 text-sm mt-3 hidden">Incorrect PIN.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden max-w-5xl mx-auto p-4 sm:p-6">
    
    <!-- Top Navigation -->
    <header class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
      <div>
        <h1 class="text-2xl font-black text-white flex items-center gap-2">
          <span class="text-emerald-500">മുട്ട</span> Control Panel
        </h1>
        <p class="text-xs text-gray-400">Manage orders and store settings</p>
      </div>
      <div class="flex bg-gray-800 p-1 rounded-xl border border-gray-700">
        <button onclick="switchTab('orders')" id="tab-btn-orders" class="px-6 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white transition">Orders</button>
        <button onclick="switchTab('store')" id="tab-btn-store" class="px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition">Store Builder</button>
      </div>
    </header>

    <!-- LOADING SPINNER -->
    <div id="loader" class="text-center py-20 text-emerald-500 hidden">
      <svg class="animate-spin h-10 w-10 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
      <p class="text-sm font-bold">Syncing with Google Sheets...</p>
    </div>

    <!-- TAB 1: ORDER MANAGER -->
    <div id="tab-orders">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="metrics-container">
        <!-- Metrics will load here -->
      </div>
      <div class="bg-gray-800 rounded-3xl border border-gray-700 overflow-hidden">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
          <h2 class="font-bold text-emerald-400">Active Subscriptions & Orders</h2>
          <button onclick="fetchData()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-white">🔄 Refresh</button>
        </div>
        <div id="orders-list" class="divide-y divide-gray-700/50 max-h-[600px] overflow-y-auto">
           <!-- Orders inject here -->
        </div>
      </div>
    </div>

    <!-- TAB 2: STORE BUILDER (CMS) -->
    <div id="tab-store" class="hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- General Settings -->
        <div class="bg-gray-800 p-6 rounded-3xl border border-gray-700 shadow-lg">
          <h2 class="text-xl font-bold text-emerald-400 mb-4">Branding Settings</h2>
          <div class="space-y-4">
            <div>
              <label class="text-xs font-bold text-gray-400 uppercase">Brand Name</label>
              <input type="text" id="cms-brand" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-emerald-500 focus:outline-none mt-1">
            </div>
            <div>
              <label class="text-xs font-bold text-gray-400 uppercase">Tagline</label>
              <input type="text" id="cms-tagline" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-emerald-500 focus:outline-none mt-1">
            </div>
            <div>
              <label class="text-xs font-bold text-gray-400 uppercase">About Text</label>
              <textarea id="cms-about" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-emerald-500 focus:outline-none mt-1"></textarea>
            </div>
            <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
              💾 Save Branding
            </button>
          </div>
        </div>

        <!-- Product Creator -->
        <div class="bg-gray-800 p-6 rounded-3xl border border-gray-700 shadow-lg">
          <h2 class="text-xl font-bold text-amber-400 mb-4">Add New Product</h2>
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Product Name</label>
                <input type="text" id="prod-name" placeholder="e.g. Daily Starter" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white mt-1">
              </div>
              <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Price (₹)</label>
                <input type="number" id="prod-price" placeholder="110" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white mt-1">
              </div>
            </div>
            <div>
              <label class="text-xs font-bold text-gray-400 uppercase">Description</label>
              <input type="text" id="prod-desc" placeholder="Pack of 6 trial eggs." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white mt-1">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Plan Type</label>
                <select id="prod-plan" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white mt-1">
                  <option value="One-Time">One-Time Order</option>
                  <option value="Weekly Plan">Weekly Plan (4 Drops)</option>
                  <option value="Bi-Weekly">Bi-Weekly Plan (2 Drops)</option>
                </select>
              </div>
              <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Emoji Icon</label>
                <input type="text" id="prod-icon" placeholder="🥚" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white mt-1">
              </div>
            </div>
            <button onclick="addProduct()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
              ➕ Add to Store
            </button>
            <p class="text-[10px] text-gray-400 text-center">To edit or delete products, open the Google Sheet directly.</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // =======================================================
    // ⚠️ PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE:
    // =======================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwj3NRnsUXOk2lz3W-uX4BeuJnqCSEP8Zi0SWRMTInYAqMArz0qSzon6pOdfcTrc-tUvQ/exec";
    // =======================================================

    function checkPin() {
      if(document.getElementById('pin-input').value === '1234') {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('dashboard').classList.remove('hidden');
        fetchData();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-orders').classList.add('hidden');
      document.getElementById('tab-store').classList.add('hidden');
      document.getElementById('tab-btn-orders').className = "px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition";
      document.getElementById('tab-btn-store').className = "px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition";
      
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tab}`).className = "px-6 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white transition";
      
      if(tab === 'store') loadCMSData();
    }

    // --- Order Manager Logic ---
    async function fetchData() {
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('orders-list').innerHTML = '';
      
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        renderOrders(data);
      } catch (err) {
        document.getElementById('orders-list').innerHTML = `<p class="p-6 text-red-400 text-center">Error connecting to database.</p>`;
      }
      document.getElementById('loader').classList.add('hidden');
    }

    function renderOrders(orders) {
      const active = orders.filter(o => o.status === 'Active' || o.status === 'Renewal Due');
      const renewals = orders.filter(o => o.status === 'Renewal Due').length;
      const completed = orders.filter(o => o.status === 'Completed').length;
      
      document.getElementById('metrics-container').innerHTML = `
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow"><div class="text-gray-400 text-xs font-bold uppercase mb-1">Active Subs</div><div class="text-3xl font-black text-white">${active.length}</div></div>
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow"><div class="text-red-400 text-xs font-bold uppercase mb-1">Renewals Due</div><div class="text-3xl font-black text-red-400">${renewals}</div></div>
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow"><div class="text-gray-400 text-xs font-bold uppercase mb-1">Total Orders</div><div class="text-3xl font-black text-emerald-400">${orders.length}</div></div>
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow"><div class="text-gray-400 text-xs font-bold uppercase mb-1">Completed</div><div class="text-3xl font-black text-gray-500">${completed}</div></div>
      `;

      document.getElementById('orders-list').innerHTML = active.map(order => `
        <div class="p-5 hover:bg-gray-700/30 transition flex flex-col sm:flex-row justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-bold text-lg text-white">${order.name}</span>
              <span class="text-[10px] bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded font-bold uppercase tracking-wider">${order.planType}</span>
            </div>
            <p class="text-xs text-gray-300 mb-0.5"><span class="font-bold text-gray-500">📞</span> ${order.phone}</p>
            <p class="text-xs text-gray-300 mb-0.5"><span class="font-bold text-gray-500">📍</span> ${order.address}</p>
            <p class="text-xs text-gray-300"><span class="font-bold text-gray-500">📦</span> ${order.items}</p>
            <p class="text-xs text-amber-400 mt-2 font-bold">Drops Completed: ${order.completedDrops} / ${order.totalDrops}</p>
          </div>
          <div class="flex flex-col gap-2 justify-center min-w-[140px]">
            <a href="https://wa.me/91${order.phone}" target="_blank" class="text-center bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 rounded-lg border border-gray-600 transition">💬 WhatsApp</a>
            ${order.completedDrops < order.totalDrops ? 
              `<button onclick="recordDrop(${order.rowIndex}, ${order.completedDrops}, ${order.totalDrops})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-lg shadow transition">🚚 Mark Drop Done</button>` 
              : `<span class="text-center text-xs font-bold text-red-400 border border-red-900 bg-red-900/20 py-2 rounded-lg">Action Required</span>`
            }
          </div>
        </div>
      `).join('');
    }

    async function recordDrop(rowIndex, currentCompleted, totalDrops) {
      if(!confirm(`Mark Drop #${currentCompleted + 1} as completed?`)) return;
      document.getElementById('loader').classList.remove('hidden');
      await fetch(SCRIPT_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "record_drop", rowIndex: rowIndex, completedDrops: currentCompleted, totalDrops: totalDrops })
      });
      setTimeout(fetchData, 1500);
    }

    // --- CMS / Store Builder Logic ---
    async function loadCMSData() {
      try {
        const response = await fetch(SCRIPT_URL + "?action=get_store_data");
        const data = await response.json();
        document.getElementById('cms-brand').value = data.settings.BrandName || '';
        document.getElementById('cms-tagline').value = data.settings.Tagline || '';
        document.getElementById('cms-about').value = data.settings.AboutText || '';
      } catch(e) { console.error("CMS Load Error"); }
    }

    async function saveSettings() {
      const btn = event.target; btn.innerText = "Saving...";
      await fetch(SCRIPT_URL, {
        method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save_settings",
          brandName: document.getElementById('cms-brand').value,
          tagline: document.getElementById('cms-tagline').value,
          aboutText: document.getElementById('cms-about').value
        })
      });
      setTimeout(() => { btn.innerText = "✅ Saved!"; setTimeout(()=>btn.innerText="💾 Save Branding", 2000); }, 1500);
    }

    async function addProduct() {
      const btn = event.target; btn.innerText = "Adding...";
      await fetch(SCRIPT_URL, {
        method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "add_product",
          name: document.getElementById('prod-name').value,
          price: document.getElementById('prod-price').value,
          description: document.getElementById('prod-desc').value,
          planType: document.getElementById('prod-plan').value,
          icon: document.getElementById('prod-icon').value
        })
      });
      setTimeout(() => { 
        btn.innerText = "✅ Product Added!"; 
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-price').value = '';
        setTimeout(()=>btn.innerText="➕ Add to Store", 2000); 
      }, 1500);
    }
  </script>
</body>
</html>
