<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>മുട്ട (MOTTA) | Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@700;800;900&family=Outfit:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { motta: { 50: '#FAF8F5', 100: '#F3EFE6', 200: '#E5DDCB', 700: '#8C6D3B', 800: '#3D311D', 900: '#1F190E' }, leaf: { 600: '#1E5128' } }, fontFamily: { sans: ['"Outfit"', 'sans-serif'], malayalam: ['"Noto Sans Malayalam"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] } } } }
  </script>
</head>
<body class="bg-motta-50 text-motta-900 font-sans antialiased flex flex-col min-h-screen" onload="loadStoreData()">

  <!-- Header -->
  <header class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-motta-200 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="#" class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-leaf-600 text-white rounded-xl flex items-center justify-center text-lg shadow-sm">🥚</div>
        <div>
          <div class="flex items-baseline gap-1.5">
            <span class="font-malayalam text-2xl font-black tracking-tight text-motta-900 leading-none cms-brand-name">Loading...</span>
          </div>
        </div>
      </a>
      <button onclick="toggleCart()" class="bg-motta-100 hover:bg-motta-200 text-motta-900 px-4 py-2 rounded-full font-bold flex items-center gap-2 border border-motta-200 text-sm">
        <span>Basket</span>
        <span id="cart-count" class="bg-leaf-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-16 md:py-24 bg-gradient-to-b from-motta-100/70 to-motta-50">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center">
      <span id="cms-tagline" class="inline-block bg-white border border-motta-200 text-leaf-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full shadow-sm mb-6">Loading store data...</span>
      <h1 class="font-serif text-4xl sm:text-6xl font-black tracking-tight text-motta-900 leading-[1.15] mb-6">
        <span class="font-malayalam font-black text-leaf-600 cms-brand-name">മുട്ട</span>
      </h1>
      <p id="cms-about" class="text-base sm:text-lg text-motta-700 max-w-xl mx-auto mb-10 leading-relaxed"></p>
    </div>
  </section>

  <!-- Dynamic Products Grid -->
  <section class="py-16 max-w-6xl mx-auto px-4 sm:px-6">
    <div id="loading-spinner" class="text-center text-leaf-600 py-10 font-bold animate-pulse">
      Fetching latest products from the farm...
    </div>
    <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Products will be injected here via JavaScript -->
    </div>
  </section>

  <!-- Slide-out Cart (Simplified for brevity) -->
  <div id="cart-drawer" class="fixed inset-0 z-40 overflow-hidden pointer-events-none opacity-0 transition-opacity">
    <div class="absolute inset-0 bg-motta-900/50 backdrop-blur-sm" onclick="toggleCart()"></div>
    <div class="fixed inset-y-0 right-0 max-w-md w-full bg-white p-6 shadow-2xl flex flex-col pointer-events-auto transform translate-x-full transition-transform" id="cart-panel">
      <div class="flex justify-between items-center pb-4 border-b border-motta-200">
        <h3 class="font-serif text-xl font-bold">Basket</h3>
        <button onclick="toggleCart()" class="text-2xl font-bold">&times;</button>
      </div>
      <div id="cart-items" class="flex-grow overflow-y-auto py-4"></div>
      <div class="pt-4 border-t border-motta-200 space-y-2.5">
        <div class="flex justify-between font-bold text-lg">Total: <span id="cart-total" class="text-leaf-600">₹0</span></div>
        <input type="text" id="cust-name" placeholder="Name *" class="w-full p-2.5 border rounded-xl text-xs">
        <input type="tel" id="cust-phone" placeholder="WhatsApp Number *" class="w-full p-2.5 border rounded-xl text-xs">
        <input type="text" id="cust-address" placeholder="Address *" class="w-full p-2.5 border rounded-xl text-xs">
        <button onclick="checkout()" class="w-full bg-leaf-600 hover:bg-leaf-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-md">Confirm Order via WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ CONFIGURE YOUR DETAILS:
    // =========================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwj3NRnsUXOk2lz3W-uX4BeuJnqCSEP8Zi0SWRMTInYAqMArz0qSzon6pOdfcTrc-tUvQ/exec"; // PASTE URL HERE
    const MY_WHATSAPP_NUMBER = "9809193616"; 
    // =========================================================================

    let cart = [];

    async function loadStoreData() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL + "?action=get_store_data");
        const data = await response.json();
        
        // Apply CMS Settings
        document.querySelectorAll('.cms-brand-name').forEach(el => el.innerText = data.settings.BrandName || 'മുട്ട (MOTTA)');
        document.getElementById('cms-tagline').innerText = data.settings.Tagline || 'Pure Free-Range Eggs.';
        document.getElementById('cms-about').innerText = data.settings.AboutText || 'Fresh from farm.';
        
        // Render CMS Products
        document.getElementById('loading-spinner').style.display = 'none';
        const grid = document.getElementById('product-grid');
        
        if (data.products.length === 0) {
          grid.innerHTML = `<p class="text-center col-span-3 text-motta-700">No products available yet. Add them in the Admin Panel!</p>`;
          return;
        }

        grid.innerHTML = data.products.map(p => `
          <div class="bg-white rounded-3xl border-2 border-motta-200 p-6 flex flex-col justify-between shadow-sm">
            <div>
              <div class="text-4xl mb-3">${p.icon}</div>
              <span class="text-[11px] font-bold uppercase text-motta-800 bg-motta-100 px-3 py-1 rounded-full">${p.planType}</span>
              <h3 class="font-serif text-xl font-bold mt-4 text-motta-900">${p.name}</h3>
              <p class="text-xs text-motta-700 mt-1">${p.description}</p>
              <div class="mt-4"><span class="font-serif text-3xl font-black text-motta-900">₹${p.price}</span></div>
            </div>
            <button onclick="addToCart('${p.name}', ${p.price}, '${p.planType}')" class="mt-6 w-full bg-motta-900 text-white font-bold py-3 rounded-xl">Add to Basket</button>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error loading store:", err);
        document.getElementById('loading-spinner').innerText = "Failed to connect to farm. Please refresh.";
      }
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      const panel = document.getElementById('cart-panel');
      if (drawer.classList.contains('pointer-events-none')) {
        drawer.classList.remove('pointer-events-none', 'opacity-0');
        panel.classList.remove('translate-x-full');
      } else {
        panel.classList.add('translate-x-full');
        drawer.classList.add('opacity-0');
        setTimeout(() => drawer.classList.add('pointer-events-none'), 300);
      }
    }

    function addToCart(title, price, planType) {
      const existing = cart.find(i => i.title === title && i.planType === planType);
      if (existing) existing.qty += 1;
      else cart.push({ title, price, planType, qty: 1 });
      updateCartUI();
      toggleCart();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total').innerText = `₹${total}`;
      
      document.getElementById('cart-items').innerHTML = cart.map(i => `
        <div class="border-b py-2 flex justify-between">
          <div><h4 class="text-sm font-bold">${i.title}</h4><span class="text-[10px] text-leaf-600">${i.planType}</span></div>
          <div class="text-right font-bold text-sm">x${i.qty}<br>₹${i.price * i.qty}</div>
        </div>
      `).join('');
    }

    async function checkout() {
      if(cart.length === 0) return alert("Basket is empty!");
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      if(!name || !phone || !address) return alert("Fill all details");

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const items = cart.map(i => `${i.title} (${i.planType}) x${i.qty}`).join(', ');
      
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "new_order", name, phone, address, slot: "Morning", items, total: `₹${total}`, planType: cart[0].planType })
        });
      } catch(e) {}

      let msg = `*NEW ORDER*\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n*Items:*\n${items}\n\n*Total:* ₹${total}`;
      window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
