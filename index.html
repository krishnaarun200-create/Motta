<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | Motta</title>
    
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS for GPS Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-amber-50 text-gray-800 font-sans min-h-screen flex flex-col relative">

    <!-- Header Section -->
    <header class="bg-amber-400 p-8 text-center shadow-sm">
        <h1 id="brand-name" class="text-4xl md:text-5xl font-extrabold text-amber-900 tracking-tight">
            <!-- Data injected via JS -->
            Loading...
        </h1>
        <p id="tagline" class="text-lg mt-3 text-amber-800 font-medium max-w-2xl mx-auto">
            <!-- Data injected via JS -->
        </p>
    </header>

    <!-- About Section -->
    <section class="max-w-3xl mx-auto p-6 mt-4 text-center">
        <p id="about-text" class="text-gray-700 text-lg leading-relaxed">
            <!-- Data injected via JS -->
        </p>
    </section>

    <!-- Products Catalog -->
    <main class="flex-grow max-w-6xl mx-auto p-6 w-full">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900 border-b-2 border-amber-200 pb-2 inline-block">Our Farm Fresh Plans</h2>
        </div>
        
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="text-center text-amber-600 font-semibold py-10">
            Fetching fresh data from the farm...
        </div>

        <!-- Products Grid -->
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Product Cards injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-amber-900 text-amber-100 text-center p-4 mt-8">
        <p>&copy; 2026 Motta. All rights reserved.</p>
    </footer>

    <!-- Checkout Modal (Hidden by default) -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center hidden z-50 p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-amber-500 text-white p-4 flex justify-between items-center">
                <h3 class="text-xl font-bold">Complete Your Order</h3>
                <button onclick="closeModal()" class="text-white hover:text-amber-200 font-bold text-2xl">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto">
                <p id="selected-product-summary" class="font-semibold text-gray-800 mb-4 bg-amber-50 p-3 rounded-lg"></p>
                
                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="cust-name" required class="mt-1 w-full p-3 border border-gray-300 rounded-xl focus:ring-amber-500 focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Phone Number (WhatsApp)</label>
                        <input type="tel" id="cust-phone" required class="mt-1 w-full p-3 border border-gray-300 rounded-xl focus:ring-amber-500 focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Preferred Delivery Slot</label>
                        <select id="cust-slot" class="mt-1 w-full p-3 border border-gray-300 rounded-xl focus:ring-amber-500 focus:border-amber-500">
                            <option value="Morning (6 AM - 8 AM)">Morning (6 AM - 8 AM)</option>
                            <option value="Evening (5 PM - 7 PM)">Evening (5 PM - 7 PM)</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pin Your Location for Delivery</label>
                        <div id="map" class="h-48 w-full rounded-xl border border-gray-300 z-10 relative"></div>
                        <p class="text-xs text-gray-500 mt-1">Drag the map to place the pin exactly on your house.</p>
                    </div>
                    
                    <input type="hidden" id="gps-coords">
                    
                    <button type="submit" id="submit-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl transition-colors mt-4 shadow-md">
                        Confirm Order
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Logic to Fetch, Display, and Submit Data -->
    <script>
        // Your exact Google Apps Script API endpoint
        const API_URL = "https://script.google.com/macros/s/AKfycbwKmMQVosM6bVhpJKvm5uueebh0N1BuiIUb9Iu1srJZqnrMTJ0QrRNvurK8eABoD0W2IA/exec";

        let map;
        let marker;
        let currentProduct = {};

        // 1. Fetch and Display Store Data
        async function initializeStore() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                // Populate Settings
                document.getElementById('brand-name').innerText = data.settings.BrandName || 'Motta';
                document.getElementById('tagline').innerText = data.settings.Tagline || '';
                document.getElementById('about-text').innerText = data.settings.AboutText || '';
                document.title = data.settings.BrandName || 'Motta';

                // Populate Products
                const productContainer = document.getElementById('product-list');
                const loadingIndicator = document.getElementById('loading-indicator');
                
                loadingIndicator.classList.add('hidden');
                productContainer.classList.remove('hidden');

                data.products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-2xl shadow-md border border-amber-100 flex flex-col justify-between hover:shadow-lg transition-shadow duration-300";
                    
                    const stockStatus = product.inStock 
                        ? `<span class="text-emerald-600 text-xs font-bold uppercase tracking-wide bg-emerald-50 px-2 py-1 rounded">In Stock</span>`
                        : `<span class="text-rose-600 text-xs font-bold uppercase tracking-wide bg-rose-50 px-2 py-1 rounded">Out of Stock</span>`;

                    const icon = product.icon ? product.icon : '🥚';

                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-4xl bg-amber-50 p-3 rounded-full">${icon}</span>
                                ${stockStatus}
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">${product.name}</h3>
                            <p class="text-gray-600 mb-5 text-sm leading-relaxed min-h-[3rem]">${product.description}</p>
                            
                            <div class="inline-flex items-center text-xs font-semibold text-amber-800 bg-amber-100 px-3 py-1.5 rounded-full mb-6">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                ${product.planType}
                            </div>
                        </div>
                        <div class="mt-auto border-t border-gray-100 pt-4">
                            <div class="text-2xl font-extrabold text-gray-900 mb-4">₹${product.price}</div>
                            <button 
                                ${!product.inStock ? 'disabled' : ''} 
                                data-name="${product.name}" 
                                data-price="${product.price}" 
                                data-plan="${product.planType}"
                                onclick="openCheckout(this)"
                                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl transition-colors ${!product.inStock ? 'opacity-50 cursor-not-allowed hover:bg-amber-500' : ''}">
                                ${product.inStock ? 'Select Plan' : 'Sold Out'}
                            </button>
                        </div>
                    `;
                    productContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading store data:", error);
                document.getElementById('loading-indicator').innerHTML = `<span class="text-red-500">Failed to load data from the farm. Please try refreshing the page.</span>`;
            }
        }

        // 2. Map and Checkout Modal Logic
        function openCheckout(buttonElement) {
            const name = buttonElement.getAttribute('data-name');
            const price = buttonElement.getAttribute('data-price');
            const planType = buttonElement.getAttribute('data-plan');
            
            currentProduct = { name, price, planType };
            document.getElementById('selected-product-summary').innerText = `${name} - ₹${price} (${planType})`;
            document.getElementById('checkout-modal').classList.remove('hidden');
            
            if (!map) {
                // Initialize map (Default coordinates)
                map = L.map('map').setView([8.5241, 76.9366], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                
                marker = L.marker([8.5241, 76.9366], { draggable: true }).addTo(map);
                
                marker.on('dragend', function (e) {
                    const coords = e.target.getLatLng();
                    document.getElementById('gps-coords').value = `${coords.lat},${coords.lng}`;
                });
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        map.setView([lat, lng], 15);
                        marker.setLatLng([lat, lng]);
                        document.getElementById('gps-coords').value = `${lat},${lng}`;
                    });
                }
            }
            
            // Fix map rendering issues inside hidden modals
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        function closeModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        // 3. Form Submission Logic
        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Placing Order...";
            submitBtn.disabled = true;

            const coords = document.getElementById('gps-coords').value || "Location not pinned";
            const googleMapsLink = coords !== "Location not pinned" ? `https://maps.google.com/?q=${coords}` : coords;

            const orderData = {
                action: "createOrder",
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                slot: document.getElementById('cust-slot').value,
                address: googleMapsLink, 
                productName: currentProduct.name,
                price: currentProduct.price,
                planType: currentProduct.planType
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(orderData)
                });
                
                const result = await response.json();
                if (result.status === "Success") {
                    alert("Order placed successfully! We will contact you soon.");
                    closeModal();
                    document.getElementById('checkout-form').reset();
                } else {
                    alert("Error placing order. Please try again.");
                }
            } catch (error) {
                alert("Connection error. Please try again later.");
            } finally {
                submitBtn.innerText = "Confirm Order";
                submitBtn.disabled = false;
            }
        });

        // Boot up the store
        initializeStore();
    </script>
</body>
</html>
